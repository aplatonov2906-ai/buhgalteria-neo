<style>
:root{--bg:#ffffff;--tint:#f4f6fa;--ink:#0d1220;--ink-soft:#5a6272;--line:#e6e9ef;--blue:#2447f5;--lime:#d8f34e}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Golos Text',system-ui,sans-serif;background:var(--bg);color:var(--ink);

}
.code span{background:var(--lime);color:var(--ink);border-radius:14px;padding:0 .08em}
h1{font-family:'Inter Tight',sans-serif;font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
p{color:var(--ink-soft);max-width:440px;margin-bottom:32px}
.btn{
  display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;
  padding:15px 30px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;
  transition:background .2s;
}
.btn:hover{background:#1a35c4}
.links{margin-top:28px;font-size:13.5px;color:var(--ink-soft);display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.links a{color:var(--ink-soft)}
